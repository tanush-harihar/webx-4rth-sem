<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Projects Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:#111827;
    padding:30px;
    border-radius:16px;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

a{
    text-decoration:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}
</style>
</head>

<body>

<div class="container">
    <h1>Web Projects Collection</h1>

    <div class="grid">

        <a href="blogging/blog.html">
            <button>Blogging Website</button>
        </a>

        <a href="feedback/feadback.html">
            <button>Feedback Form</button>
        </a>

        <a href="gateform/index.html">
            <button>Gate Pass Form</button>
        </a>

        <a href="library/library.html">
            <button>Library Management</button>
        </a>

        <a href="portfolio/port.html">
            <button>Portfolio Website</button>
        </a>

        <a href="quiz/main.html">
            <button>Quiz Application</button>
        </a>

        <a href="todolist/taskly.html">
            <button>To-Do List App</button>
        </a>

        <a href="tomato/index.html">
            <button>Tomato Website</button>
        </a>

    </div>
</div>

</body>
</html>
